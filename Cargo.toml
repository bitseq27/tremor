[package]
name = "tremor"
version = "0.1.0"
edition = "2021"
description = "Real-Time 3D Seismic Monitor - Rust/wgpu native Windows dashboard"
license = "MIT"

[dependencies]
wgpu = "25"
winit = "0.30"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-native-tls = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
bytemuck = { version = "1", features = ["derive"] }
cgmath = "0.18"

# Low-RAM sandbox: no debuginfo, single codegen unit where possible, dev build is what we run.
[profile.dev]
debug = 0
opt-level = 0
incremental = true

[profile.release]
strip = true
lto = false
codegen-units = 16
